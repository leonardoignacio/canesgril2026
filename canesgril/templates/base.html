{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Canes Grill - Receitas de Churrasco">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <title>Canes Grill | {% block title %}Bem-vindo{% endblock %}</title>

    <!-- Favicon e Stylesheet -->
    <link rel="icon" href="{% static 'img/core-img/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'site.css' %}">
</head>

<body>
    <!-- Injeção do Cabeçalho (Preloader, Busca e Menu) -->
    {% include 'partials/_header.html' %}

    <!-- Onde o conteúdo das páginas filhas será injetado -->
    {% block content %}
    {% endblock %}

    <!-- Injeção do Rodapé -->
    {% include 'partials/_footer.html' %}

    <!-- ##### All Javascript Files ##### -->
    <script src="{% static 'js/jquery/jquery-2.2.4.min.js' %}"></script>
    <script src="{% static 'js/bootstrap/popper.min.js' %}"></script>
    <script src="{% static 'js/bootstrap/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/plugins/plugins.js' %}"></script>
    <script src="{% static 'js/active.js' %}"></script>
</body>

</html>
