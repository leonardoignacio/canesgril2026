{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="contact-area section-padding-0-80 mt-5">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="section-heading text-center mb-4">
                    <h2>Acesso ao Sistema</h2>
                </div>
            </div>
        </div>
        
        {% include 'partials/_alertas.html' %}
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="contact-form-area">
                    <form action="{% url 'usuarios:login' %}" method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label for="email"><b>Email</b></label>
                                <input type="email" id="email" class="form-control" name="email" placeholder="Entre com o email cadastrado" required>
                            </div>
                            <div class="col-12 mb-4">
                                <label for="senha"><b>Senha</b></label>
                                <input id="senha" type="password" class="form-control" name="senha" placeholder="Digite aqui sua senha" required>
                            </div>
                            <div class="col-12 text-center">
                                <button class="btn btn-success mb-2 w-100" type="submit">Acessar Conta</button>
                                <a href="{% url 'usuarios:cadastro' %}" class="btn btn-outline-primary w-100">Faça seu Cadastro</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
