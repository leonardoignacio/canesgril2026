{% extends 'base.html' %}
{% load static %}

{% block title %}Criar Conta{% endblock %}

{% block content %}
<div class="contact-area section-padding-0-80 mt-5">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="section-heading text-center mb-4">
                    <h2>Criar conta</h2>
                </div>
            </div>
        </div>
        
        {% include 'partials/_alertas.html' %}
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                <div class="contact-form-area">
                    <form action="{% url 'usuarios:cadastro' %}" method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label for="nome"><b>Nome completo</b></label>
                                <input type="text" class="form-control" name="nome" placeholder="Ex.: Anderson Silva" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label for="email"><b>Email</b></label>
                                <input type="email" class="form-control" name="email" placeholder="Ex.: silva@churras.com" required>
                            </div>
                            <div class="col-12 col-lg-6 mb-3">
                                <label for="password"><b>Senha</b></label>
                                <input type="password" class="form-control" name="password" placeholder="Digite sua senha" required>
                            </div>
                            <div class="col-12 col-lg-6 mb-3">
                                <label for="password2"><b>Confirmação de senha</b></label>
                                <input type="password" class="form-control" name="password2" placeholder="Repita sua senha" required>
                            </div>
                            <div class="col-12 text-center mt-4">
                                <button class="btn btn-success" type="submit">Criar sua conta</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
